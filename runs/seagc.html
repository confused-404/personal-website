<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

<body data-project="seagc">
  <header><a class="wordmark" href="../index.html">Yves Kloeckner</a><p id="progress"></p></header>
  <main id="run" tabindex="0" aria-label="Project trail. Click or tap to ride, or use the Continue downhill button.">
    <div class="landscape" aria-hidden="true">

      <section class="information" aria-live="polite" aria-atomic="true">
        <p id="stop-label"></p><h1 id="stop-title"></h1><p id="stop-copy"></p>
        <div id="finish" hidden><a id="github" target="_blank" rel="noopener noreferrer">Open the project on GitHub <span aria-hidden="true">↗</span></a><p class="finish-note">Your next trail starts at the summit.</p></div>
      </section>
      <div class="station-posts" aria-hidden="true"></div>
    </div>
    <div id="rider"><svg viewBox="0 0 110 120" aria-hidden="true"><g fill="none" stroke="#253e46" stroke-linecap="round" stroke-linejoin="round"><path d="m29 87 23-24 22 24" stroke-width="12"/><path d="m50 35-8 29 21 7 8-30" fill="#b9573d" stroke-width="4"/><path class="riding-arms" d="m46 44-19 14-15-5m56-9 19 12 12-2" stroke-width="8"/>

    <button id="previous" type="button" class="rope-tow"><svg viewBox="0 0 150 70" aria-hidden="true"><path d="M20 20v45m105-45v45"/>
      <path class="tow-cable" d="M0 20h150" stroke-dasharray="6 4"/>
      <g class="tow-handle"><path d="M85 20v25m-17 0h34"/></g>
      <g class="tow-wheel wheel-left"><circle cx="20" cy="20" r="9"/><path d="m11 20h18m-9-9v18"/></g>
      <g class="tow-wheel wheel-right"><circle cx="125" cy="20" r="9"/><path d="m116 20h18m-9-9v18"/></g></svg><span>Rope tow <small>Previous stop</small></span></button>
    <a href="../index.html" class="lift" aria-label="Board the chairlift back to trail selection"><svg viewBox="0 0 180 170" aria-hidden="true"><g stroke="#3f585d" fill="none" stroke-width="4" stroke-linejoin="round"><path d="M0 18 180 0M90 9v38l-30 27v61h89V74H92"/><path d="M60 119h89M72 119V91h64v28"/><path d="M60 136h89" stroke-width="7"/><circle cx="90" cy="10" r="6" fill="#b9573d"/></g></svg><span>Chairlift <small>Back to the summit ↗</small></span></a>

  </main>
